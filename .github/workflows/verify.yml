name: Open University Course TM

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [course-verify]

permissions:
  contents: read

concurrency:
  group: open-university-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify sub-2KB one-liner
        run: |
          bytes=$(wc -c < Open_University_TM.sh)
          lines=$(wc -l < Open_University_TM.sh)
          echo "bytes=$bytes lines=$lines"
          test "$bytes" -lt 2048
          test "$lines" -eq 1
          sh -n Open_University_TM.sh
      - name: Verify no-AI total fallback
        run: |
          env -u AI sh Open_University_TM.sh Logic /tmp/offline.md 2 > /tmp/offline.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/offline.json'));s=open('/tmp/offline.md').read()
          assert x['R']==0 and x['MODE']=='fallback'
          assert sum(a.startswith('## Chapter ') for a in s.splitlines())==2
          for h in ['Learning Objectives','Chapter Overview','Key Terms','Main Text','Learning Activity','Self-Assessment','Answer Key','Chapter Summary','References']:
              assert s.count('### '+h)==2
          assert 'Offline framework:' in s
          PY
      - name: Verify broken AI falls back to a course
        run: |
          AI='command_that_does_not_exist_ou_tm' sh Open_University_TM.sh Ethics /tmp/broken.md 1 > /tmp/broken.json 2>/tmp/err
          test -s /tmp/broken.md
          ! grep -q Traceback /tmp/err
          grep -q 'Offline framework:' /tmp/broken.md
      - name: Verify optional AI enrichment
        run: |
          cat > /tmp/mockai <<'PY'
          #!/usr/bin/env python3
          print('AI-enriched lesson: definitions, arguments, objections, evidence, and replies.')
          PY
          chmod +x /tmp/mockai
          AI=/tmp/mockai sh Open_University_TM.sh Test /tmp/ai.md 1 > /tmp/ai.json
          grep -q 'AI-enriched lesson:' /tmp/ai.md
          python3 -c 'import json;x=json.load(open("/tmp/ai.json"));assert x["R"]==0'
      - name: Verify repository policy files
        run: |
          test -s COURSE_STANDARD.md
          test -s README.md
          test -s sources/bibliography.txt
          grep -q 'OPEN=true' README.md
          grep -q 'FINAL=false' README.md
