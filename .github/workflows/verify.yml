name: Open University Course TM

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [course-verify]

permissions:
  contents: read

concurrency:
  group: open-university-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify sub-2KB one-liner
        run: |
          bytes=$(wc -c < Open_University_TM.sh)
          lines=$(wc -l < Open_University_TM.sh)
          echo "bytes=$bytes lines=$lines"
          test "$bytes" -lt 2048
          test "$lines" -eq 1
          sh -n Open_University_TM.sh
      - name: Verify clean missing-backend failure
        run: |
          set +e
          AI='command_that_does_not_exist_ou_tm' sh Open_University_TM.sh Test /tmp/x.md 1 >/tmp/out 2>/tmp/err
          code=$?
          set -e
          test "$code" -ne 0
          grep -q '^AI_FAIL:' /tmp/err
          ! grep -q 'Traceback' /tmp/err
      - name: Verify zero-residual generation with mock AI
        run: |
          printf '%s\n' 'Verified CI source' > /tmp/sources.txt
          cat > /tmp/mockai <<'PY'
          #!/usr/bin/env python3
          import sys
          p=sys.stdin.read()
          if 'Return exactly' in p: print('1. Test Chapter')
          elif 'Write chapter' in p:
              hs=['Learning Objectives','Chapter Overview','Key Terms','Main Text','Learning Activity','Self-Assessment','Answer Key','Chapter Summary','References']
              for h in hs:
                  print('### '+h)
                  if h=='Learning Objectives': print('\n'.join('- Objective '+str(i) for i in range(1,6)))
                  elif h=='Main Text': print('[SRC:1] '+'x'*6500)
                  else: print('[SRC:1] Test')
          elif 'Write audience' in p: print('[SRC:1] Course profile')
          else: print('[SRC:1] Final review')
          PY
          chmod +x /tmp/mockai
          AI=/tmp/mockai SOURCE_PACK=/tmp/sources.txt sh Open_University_TM.sh Test /tmp/course.md 1 > /tmp/result.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/result.json'))
          assert x['R']==0 and x['STRUCTURE'] and x['SOURCES']
          s=open('/tmp/course.md').read()
          assert sum(line.startswith('## Chapter ') for line in s.splitlines())==1 and '[SRC:1]' in s
          PY
      - name: Verify repository policy files
        run: |
          test -s COURSE_STANDARD.md
          test -s README.md
          test -s sources/bibliography.txt
          grep -q 'OPEN=true' README.md
          grep -q 'FINAL=false' README.md
